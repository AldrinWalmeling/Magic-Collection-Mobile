name: magic_collection

description: Magic Collection — gerenciador de coleção Magic The Gathering.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  http: ^1.2.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.0
  share_plus: ^13.3.0
  csv: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.2
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0
  file_picker: ^13.0.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/magic/
    - assets/backgrounds/

flutter_launcher_icons:
  android: true
  ios: false
  # Legado (API 21-25): o pacote EXIGE image_path; sem ele a geração
  # aborta. Em API 26+ vale o Adaptive abaixo. Usa o background
  # (o icon_app.png antigo não existe mais no projeto).
  image_path: "assets/icons/background.png"
  # Foreground com área segura: derivado MECÂNICO do foreground.png
  # (mesmo símbolo, só reduzido p/ caber no círculo de 66dp; originais
  # intactos — para voltar, aponte de volta para foreground.png).
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground_safe.png"
  min_sdk_android: 21